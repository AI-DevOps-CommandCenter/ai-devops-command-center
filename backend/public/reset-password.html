
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | DevOps Command Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
            color: #1e293b;
            font-size: 25px;
        }

        p {
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Reset Your Password</h1>

        <p>
            Enter your new password below to regain access
            to your DevOps Command Center account.
        </p>

        <form id="resetForm">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="8"
                required
                autocomplete="new-password"
                disabled
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
                autocomplete="new-password"
                disabled
            >

            <button type="submit" id="resetButton" disabled>
                Reset Password
            </button>

        </form>

        <div id="message" role="status" aria-live="polite">
            Verifying your recovery link...
        </div>

    </div>

    <!-- Load external JavaScript file -->
    <script type="module" src="/reset-password.js"></script>

</body>

</html>
