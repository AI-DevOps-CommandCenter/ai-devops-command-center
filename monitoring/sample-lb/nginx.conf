# Load balancer in front of sample-app and the replicas the executor's `scale`
# action adds. Every instance joins the Docker network with the alias
# `sample-app`, so Docker's DNS (127.0.0.11) returns one address per instance.
# proxy_pass with a variable makes nginx resolve the name again every `valid`
# seconds and spread requests over all addresses (round robin).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        # The admin API stays reachable only on each container directly.
        location /admin/ {
            return 403;
        }

        location / {
            set $sample_app http://sample-app:8000;
            proxy_pass $sample_app;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Show which instance answered (useful to see the scale-up working).
            add_header X-Upstream $upstream_addr always;
        }
    }
}
