server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        # Only containers that opt in with the label logging=promtail.
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # `service` = the compose service name, the label n8n uses (LOKI_SERVICE_LABEL=service).
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # sample-app writes JSON lines; keep `level` as a label (fixed small set of values).
      - json:
          expressions:
            level: level
      - labels:
          level:
